services:
  - type: web
    name: imaginary-tables-backend
    env: node
    plan: free
    buildCommand: npm install && cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: FRONTEND_URL
        value: https://thempsnicegames.netlify.app
      - key: DATA_DIR
        value: ./data
